name: Extrair site da Girofy

on:
  push:
    paths:
      - "girofy-site-vercel.zip"

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair arquivos do site
        run: |
          unzip -o girofy-site-vercel.zip -d .
          rm -f girofy-site-vercel.zip girofy-portfolio-v2-timeline-integrated.zip

      - name: Salvar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair arquivos do site para Vercel"
          git push origin "HEAD:${GITHUB_REF_NAME}"
