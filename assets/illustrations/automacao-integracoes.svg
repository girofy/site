<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Automação conecta sistemas e mantém exceções à vista</title><desc id="d">A cópia manual entre vendas, financeiro e operação é substituída por uma rota automatizada; uma exceção segue para uma pessoa revisar.</desc>
<defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:13 12;animation:flow 2.6s linear infinite}.manual{stroke:#e5484d}.auto{stroke:#238636}.pulse{animation:pulse 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-50}}@keyframes pulse{50%{opacity:.32;transform:scale(.75)}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
<rect x="12" y="12" width="736" height="406" rx="28" fill="#f3f3f2"/>
<text x="48" y="54" fill="#777" font-size="10" font-weight="700" letter-spacing="1.8">O MESMO DADO NÃO PRECISA DE TRÊS DIGITAÇÕES</text>
<g><rect x="44" y="82" width="173" height="94" rx="16" fill="#fff" stroke="#ddd" stroke-width="2"/><rect x="292" y="82" width="173" height="94" rx="16" fill="#fff" stroke="#ddd" stroke-width="2"/><rect x="540" y="82" width="173" height="94" rx="16" fill="#fff" stroke="#ddd" stroke-width="2"/></g>
<rect x="61" y="101" width="29" height="29" rx="8" fill="#111"/><path d="M69 111h13M69 118h9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="101" y="112" fill="#777" font-size="9" font-weight="700" letter-spacing="1">SISTEMA 01</text><text x="101" y="140" fill="#111" font-size="16" font-weight="700">Comercial</text><text x="101" y="158" fill="#777" font-size="10">Pedido criado</text>
<rect x="309" y="101" width="29" height="29" rx="8" fill="#111"/><path d="M316 108h15v15h-15zM319 112h9M319 116h9M319 120h6" fill="none" stroke="#fff" stroke-width="1.6"/><text x="349" y="112" fill="#777" font-size="9" font-weight="700" letter-spacing="1">SISTEMA 02</text><text x="349" y="140" fill="#111" font-size="16" font-weight="700">Financeiro</text><text x="349" y="158" fill="#777" font-size="10">Fatura lançada</text>
<rect x="557" y="101" width="29" height="29" rx="8" fill="#111"/><path d="M564 108h15v15h-15zM568 113h7M568 117h7" fill="none" stroke="#fff" stroke-width="1.6"/><text x="597" y="112" fill="#777" font-size="9" font-weight="700" letter-spacing="1">SISTEMA 03</text><text x="597" y="140" fill="#111" font-size="16" font-weight="700">Operação</text><text x="597" y="158" fill="#777" font-size="10">Equipe avisada</text>
<path class="route manual" d="M130 176v33q0 18 18 18h58q20 0 20 18M378 176v34M626 176v33q0 18-18 18h-58q-20 0-20 18"/><circle class="pulse" cx="226" cy="245" r="8" fill="#e5484d"/><rect x="250" y="222" width="260" height="44" rx="22" fill="#fff" stroke="#edb4b5" stroke-width="2"/><text x="286" y="249" fill="#c93c42" font-size="11" font-weight="700" letter-spacing="1">COPIAR · COLAR · CONFERIR</text>
<path class="route auto" d="M130 176v127h496V176M378 176v127"/><circle class="pulse" cx="378" cy="303" r="10" fill="#238636"/><rect x="229" y="321" width="302" height="61" rx="15" fill="#111"/><text x="254" y="346" fill="#aaa" font-size="9" font-weight="700" letter-spacing="1.5">FLUXO AUTOMATIZADO</text><text x="254" y="369" fill="#fff" font-size="15" font-weight="700">Um dado. Três etapas atualizadas.</text><path d="m487 350 8 8 15-17" fill="none" stroke="#58a66b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="690" cy="336" r="19" fill="#fff" stroke="#e5484d" stroke-width="3"/><path d="M690 325v13m0 7v1" stroke="#c93c42" stroke-width="3" stroke-linecap="round"/><text x="654" y="376" fill="#c93c42" font-size="8" font-weight="700" letter-spacing=".5">EXCEÇÃO → PESSOA</text>
</svg>
