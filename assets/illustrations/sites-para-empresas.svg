<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Da pesquisa do comprador ao site que explica a oferta</title><desc id="d">O comprador procura um serviço, encontra informações dispersas e pode desistir. Um site próprio reúne oferta, diferenciais, prova e contato num resultado rastreável.</desc>
<defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:12 12;animation:flow 2.7s linear infinite}.bad{stroke:#e5484d}.good{stroke:#238636}.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes pulse{50%{opacity:.32}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
<rect x="12" y="12" width="736" height="406" rx="28" fill="#f3f3f2"/>
<g><rect x="39" y="72" width="270" height="76" rx="15" fill="#fff" stroke="#dcdcdc" stroke-width="2"/><rect x="39" y="165" width="270" height="76" rx="15" fill="#fff" stroke="#dcdcdc" stroke-width="2"/><rect x="39" y="258" width="270" height="76" rx="15" fill="#fff" stroke="#dcdcdc" stroke-width="2"/><rect x="398" y="55" width="324" height="308" rx="20" fill="#fff" stroke="#d7d7d5" stroke-width="2"/></g>
<text x="60" y="99" fill="#777" font-size="9" font-weight="700" letter-spacing="1.5">PESQUISA DO COMPRADOR</text><rect x="59" y="109" width="215" height="24" rx="12" fill="#f1f1f0"/><circle cx="73" cy="121" r="5" fill="none" stroke="#777" stroke-width="2"/><path d="m77 125 4 4" stroke="#777" stroke-width="2"/><text x="91" y="125" fill="#555" font-size="10">empresa + serviço</text>
<text x="60" y="191" fill="#777" font-size="9" font-weight="700" letter-spacing="1.5">RECORTES ESPALHADOS</text><text x="60" y="218" fill="#111" font-size="15" font-weight="700">Posts · perfil · indicação</text><text x="60" y="233" fill="#999" font-size="9">Oferta e prova em lugares diferentes</text><circle class="pulse" cx="287" cy="188" r="8" fill="#e5484d"/>
<text x="60" y="285" fill="#777" font-size="9" font-weight="700" letter-spacing="1.5">O COMPRADOR AINDA DUVIDA</text><text x="60" y="313" fill="#c93c42" font-size="15" font-weight="700">“Por que escolher esta empresa?”</text><path class="route bad" d="M309 203h37q22 0 22 22v49q0 20 30 20"/><path d="m420 284 14 10-14 10" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="425" y="86" fill="#777" font-size="9" font-weight="700" letter-spacing="1.5">SEU ENDEREÇO PRÓPRIO</text><text x="425" y="119" fill="#111" font-size="22" font-weight="700">Uma oferta que se explica.</text><rect x="425" y="138" width="270" height="57" rx="10" fill="#111"/><text x="445" y="160" fill="#fff" font-size="13" font-weight="700">O que sua empresa resolve</text><text x="445" y="179" fill="#bbb" font-size="10">Para quem · como funciona · próximo passo</text>
<rect x="425" y="208" width="126" height="57" rx="10" fill="#f0f0ef"/><text x="440" y="230" fill="#777" font-size="8" font-weight="700" letter-spacing=".7">DIFERENCIAIS</text><path d="M440 243h82" stroke="#777" stroke-width="4" stroke-linecap="round"/><rect x="565" y="208" width="130" height="57" rx="10" fill="#f0f0ef"/><text x="580" y="230" fill="#777" font-size="8" font-weight="700" letter-spacing=".7">PROVAS</text><path d="M580 243h88" stroke="#777" stroke-width="4" stroke-linecap="round"/>
<path class="route good" d="M550 294h35"/><circle class="pulse" cx="565" cy="294" r="8" fill="#238636"/><rect x="425" y="281" width="270" height="56" rx="11" fill="#e4f1e6"/><text x="445" y="305" fill="#207436" font-size="10" font-weight="700" letter-spacing="1">PRÓXIMO PASSO</text><text x="445" y="325" fill="#111" font-size="13" font-weight="700">Conversa com contexto ↗</text>
