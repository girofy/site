<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Pedidos e aprovações organizados num sistema interno</title><desc id="d">Pedidos dispersos em mensagens, e-mail e planilhas entram numa fila compartilhada com responsável, prioridade e próxima etapa visíveis.</desc>
<defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke:#aaa;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 10;animation:flow 3s linear infinite}.ok{stroke:#238636}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-38}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
