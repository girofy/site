<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Uma tarefa empresarial resolvida num aplicativo móvel</title><desc id="d">Uma pessoa abre um pedido no celular, entende o status, envia a informação necessária e conclui uma ação; a operação recebe os dados sem redigitação.</desc>
<defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke:#b9b9b7;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 10;animation:flow 2.7s linear infinite}.ok{stroke:#238636}.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-38}}@keyframes pulse{50%{opacity:.36;transform:scale(.8)}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
