<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Definir escopo antes de comparar orçamentos de software</title><desc id="d">Um pedido vago deixa custo, prazo e risco em aberto. Um escopo claro registra tarefa, pessoas, dados, integrações e critério de conclusão antes da proposta.</desc>
<defs></defs><style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:11 11;animation:flow 2.8s linear infinite}.risk{stroke:#e5484d}.clear{stroke:#238636}.pulse{animation:pulse 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}@media(prefers-reduced-motion:reduce){.route,.pulse{animation:none}}</style>
<rect x="12" y="12" width="736" height="406" rx="28" fill="#f3f3f2"/>
<g><rect x="39" y="85" width="214" height="254" rx="19" fill="#111"/><rect x="475" y="62" width="248" height="302" rx="19" fill="#fff" stroke="#d8d8d6" stroke-width="2"/></g>
<text x="63" y="116" fill="#aaa" font-size="10" font-weight="700" letter-spacing="1.6">PEDIDO VAGO</text><text x="63" y="157" fill="#fff" font-size="22" font-weight="700">“Precisamos</text><text x="63" y="184" fill="#fff" font-size="22" font-weight="700">de um sistema.”</text><path d="M63 207h163" stroke="#444" stroke-width="2"/>
<rect x="62" y="225" width="166" height="37" rx="8" fill="#292929"/><circle cx="80" cy="243" r="6" fill="#e5484d"/><text x="96" y="247" fill="#ddd" font-size="11">Prazo em aberto</text><rect x="62" y="272" width="166" height="37" rx="8" fill="#292929"/><circle cx="80" cy="290" r="6" fill="#e5484d"/><text x="96" y="294" fill="#ddd" font-size="11">Integrações incertas</text><text x="63" y="329" fill="#e58b8e" font-size="9" font-weight="700" letter-spacing="1">PROPOSTAS INCOMPARÁVEIS</text>
<path class="route risk" d="M253 207h36q38 0 38 28v44q0 28 38 28h52"/><circle class="pulse" cx="328" cy="275" r="9" fill="#e5484d"/><path d="m404 299 15 8-15 9" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="501" y="96" fill="#777" font-size="9" font-weight="700" letter-spacing="1.5">ESCOPO DECIDÍVEL</text><text x="501" y="129" fill="#111" font-size="21" font-weight="700">O mesmo problema.</text><text x="501" y="154" fill="#111" font-size="21" font-weight="700">Critérios visíveis.</text>
<rect x="501" y="173" width="195" height="44" rx="9" fill="#f3f3f2"/><circle cx="520" cy="195" r="7" fill="#111"/><text x="537" y="199" fill="#111" font-size="12" font-weight="700">Tarefa e usuários</text><rect x="501" y="227" width="195" height="44" rx="9" fill="#f3f3f2"/><circle cx="520" cy="249" r="7" fill="#111"/><text x="537" y="253" fill="#111" font-size="12" font-weight="700">Dados e integrações</text><rect x="501" y="281" width="195" height="44" rx="9" fill="#e4f1e6"/><circle cx="520" cy="303" r="7" fill="#238636"/><text x="537" y="307" fill="#207436" font-size="12" font-weight="700">Critério de conclusão</text><path class="route clear" d="M520 217v10m0 44v10"/><text x="501" y="348" fill="#555" font-size="9" font-weight="700" letter-spacing=".6">PRAZO · CUSTO · RISCO COMPARÁVEIS</text>
