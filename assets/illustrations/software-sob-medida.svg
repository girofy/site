<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
<title id="t">Quando o sistema pronto não acompanha as regras da empresa</title><desc id="d">Uma exceção escapa do sistema pronto e vira planilha paralela. Um fluxo sob medida reúne a regra e mantém a operação no mesmo caminho.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e8e7"/></linearGradient></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.route{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:12 12;animation:flow 2.8s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}@media(prefers-reduced-motion:reduce){.dash,.pulse{animation:none}}</style>
<rect x="12" y="12" width="736" height="406" rx="28" fill="#f3f3f2"/><path d="M30 70H730M30 360H730" stroke="#e4e4e2" stroke-width="2"/>
<g><rect x="38" y="95" width="218" height="236" rx="20" fill="#111"/><rect x="493" y="78" width="229" height="270" rx="20" fill="url(#paper)" stroke="#d6d6d4" stroke-width="2"/></g>
<text x="62" y="128" fill="#aaa" font-size="11" font-weight="700" letter-spacing="2">SISTEMA PRONTO</text><text x="62" y="162" fill="#fff" font-size="22" font-weight="700">Fluxo padrão</text>
<rect x="60" y="183" width="173" height="37" rx="8" fill="#292929"/><circle cx="78" cy="201" r="6" fill="#f5f5f3"/><path d="M94 201h87" stroke="#aaa" stroke-width="5" stroke-linecap="round"/><path d="M60 239h173" stroke="#3a3a3a" stroke-width="2"/><text x="62" y="270" fill="#d0d0ce" font-size="12">Exceção do negócio</text><text x="62" y="299" fill="#ef5559" font-size="11" font-weight="700" letter-spacing="1">FORA DO FLUXO</text>
<path class="route dash" d="M256 201h51q33 0 33 34v40q0 24 28 24h54" stroke="#e5484d"/><circle class="pulse" cx="340" cy="275" r="10" fill="#e5484d"/><path d="m413 289 16 10-16 10" fill="none" stroke="#e5484d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="331" y="314" width="128" height="47" rx="9" fill="#fff" stroke="#edb4b5" stroke-width="2"/><path d="M348 329h42M348 341h70" stroke="#bbb" stroke-width="4" stroke-linecap="round"/><text x="346" y="354" fill="#c93c42" font-size="9" font-weight="700" letter-spacing="1">PLANILHA PARALELA</text>
<text x="518" y="113" fill="#666" font-size="10" font-weight="700" letter-spacing="1.8">SOFTWARE SOB MEDIDA</text><text x="518" y="148" fill="#111" font-size="21" font-weight="700">A regra entra.</text><text x="518" y="173" fill="#111" font-size="21" font-weight="700">O trabalho segue.</text>
<rect x="518" y="198" width="176" height="42" rx="10" fill="#fff" stroke="#d4d4d2" stroke-width="2"/><circle cx="539" cy="219" r="8" fill="#111"/><path d="M558 219h108" stroke="#777" stroke-width="5" stroke-linecap="round"/><rect x="518" y="251" width="176" height="42" rx="10" fill="#fff" stroke="#d4d4d2" stroke-width="2"/><circle cx="539" cy="272" r="8" fill="#238636"/><path d="M558 272h89" stroke="#777" stroke-width="5" stroke-linecap="round"/><path class="route dash" d="M539 227v35" stroke="#238636"/><rect x="518" y="306" width="176" height="25" rx="12" fill="#e4f1e6"/><text x="534" y="323" fill="#207436" font-size="10" font-weight="700" letter-spacing="1.1">SEM DESVIO MANUAL</text>
</svg>
