<svg xmlns="http://www.w3.org/2000/svg" class="girofy-intro-svg" viewBox="0 0 1295 903" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">Girofy</title>
  <desc id="intro-desc">A marca é desenhada pelo contorno original do símbolo; o lettering original aparece em seguida.</desc>
  <style>
    .girofy-intro-svg { overflow: visible; }
    .brand-mark { transform-box: fill-box; transform-origin: center; animation: mark-settle .20s cubic-bezier(.175,.885,.32,1.08) .32s both; }
    .symbol-fill { opacity: 0; animation: fill-symbol .16s cubic-bezier(.2,.7,.2,1) .34s both; }
    .symbol-traces { fill: none; stroke: currentColor; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
    .trace { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
    .trace-1 { animation: draw-contour .30s cubic-bezier(.2,0,.1,1) .01s both; }
    .trace-2 { animation: draw-contour .32s cubic-bezier(.2,0,.1,1) .01s both; }
    .trace-3 { animation: draw-contour .36s cubic-bezier(.2,0,.1,1) .01s both; }
    .wordmark { clip-path: inset(0 100% 0 0); animation: reveal-word .30s cubic-bezier(.2,0,.1,1) .32s both; }
    @keyframes draw-contour { to { stroke-dashoffset: 0; } }
    @keyframes fill-symbol { 0%, 18% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes mark-settle { 0% { transform: scale(.985) rotate(-1deg); } 72% { transform: scale(1.022) rotate(0); } 100% { transform: scale(1) rotate(0); } }
    @keyframes reveal-word { from { clip-path: inset(0 100% 0 0); transform: translateY(6px); } to { clip-path: inset(0 0 0 0); transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .brand-mark { animation: none; }
      .symbol-fill { opacity: 1; animation: none; }
      .symbol-traces { display: none; }
      .wordmark { clip-path: none; animation: none; transform: none; }
    }
  </style>
